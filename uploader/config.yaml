# ==============================================================================
#                 PHASE 4: YOUTUBE UPLOADER & AUTOMATION CONFIG
# ==============================================================================

timezone: "America/New_York"     # Channel broadcast timezone (RFC 3339 conversion anchor)

upload:
  mode: "scheduled"              # "scheduled" (batch evening before with publishAt) or "realtime" (run-due)
  go_live: false                 # If false, uploads as private drafts without publishAt unless --confirm-public is given
  first_run_private: true        # Safety net: first real upload is forced to private
  max_uploads_per_day: 6         # Daily quota guard (matches 6 daily slots)
  category_id: "23"              # YouTube category 23 = Comedy
  tags:
    - "shorts"
    - "comedy"
    - "funny"
    - "humor"
    - "viral"
    - "fails"
    - "laugh"
  default_language: "en"
  max_late_minutes: 30           # Realtime mode: slots past slot_time + max_late_minutes are marked late
  chunk_size_bytes: 8388608      # 8 MB resumable upload chunk size (multiple of 256 KB)

quota:
  daily_cap: 10000               # Default YouTube Data API v3 daily quota limit
  insert_cost: 1600              # Quota cost per videos.insert (configurable, not hardcoded)
  list_cost: 1                   # Quota cost per videos.list call

cleanup:
  retention_days: 14             # Delete uploaded/scheduled media older than 14 days; reserve pool is NEVER touched

alerts:
  log_file: "uploader/logs/alerts.log"
  windows_notifications: true    # Show native Windows notification if Telegram is unconfigured
